name: ${CARLA_COMPOSE_PROJECT_NAME:-my-ad-carla}

x-carla-common: &carla-common
  platform: linux/arm64
  init: true
  ipc: host
  network_mode: ${CARLA_NETWORK_MODE:-host}
  environment: &carla-environment
    CARLA_SOURCE_REPO: ${CARLA_SOURCE_REPO:-git@github.com:gottaBoy/carla.git}
    CARLA_SOURCE_REF: ${CARLA_SOURCE_REF:-dgx-arm64}
    CARLA_SOURCE_COMMIT: ${CARLA_SOURCE_COMMIT:-234caf5f30ab56eacf093e699e5adc1459fe725c}
    CARLA_SOURCE_DIR: /workspace/carla
    CARLA_UE_DIR: /workspace/unreal-engine
    CARLA_UE_REPO: ${CARLA_UE_REPO:-git@github.com:gottaBoy/UnrealEngine.git}
    CARLA_UE_REF: ${CARLA_UE_REF:-dgx-arm64}
    CARLA_UE_COMMIT: ${CARLA_UE_COMMIT:-791a451d24179902005b15d1d6af71450ff37637}
    CARLA_ARTIFACT_DIR: /artifacts/carla
  volumes:
    - ${CARLA_SOURCE_DIR:-./third_party/carla}:/workspace/carla:ro
    - ${CARLA_UE_DIR:-./third_party/unreal-engine}:/workspace/unreal-engine:ro
    - ${CARLA_ARTIFACT_DIR:-./artifacts/carla}:/artifacts/carla
    - ./scripts:/opt/my-ad/scripts:ro
    # Opt-in GB10 API-usage diagnostics; populated by
    # scripts/carla/fetch-vulkan-validation-layer.sh and unused by product runs.
    - ${CARLA_VALIDATION_LAYER_DIR:-./data/cache/vulkan-validation-layer}:/opt/vulkan-validation-layer:ro
  restart: "no"

services:
  carla-vulkan:
    <<: *carla-common
    image: ${CARLA_TOOLCHAIN_IMAGE:-my-ad/carla-toolchain:arm64}
    profiles: ["gpu"]
    entrypoint: []
    environment:
      <<: *carla-environment
      NVIDIA_DRIVER_CAPABILITIES: graphics,utility,compute
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["bash", "/opt/my-ad/scripts/carla/probe-arm64-vulkan.sh"]

  carla-dev:
    <<: *carla-common
    build:
      context: .
      dockerfile: images/carla-arm64/Dockerfile
    image: ${CARLA_TOOLCHAIN_IMAGE:-my-ad/carla-toolchain:arm64}
    profiles: ["g0"]
    entrypoint: []
    command: ["bash", "/opt/my-ad/scripts/carla/g0-probe.sh"]

  carla-build:
    <<: *carla-common
    build:
      context: .
      dockerfile: images/carla-arm64/Dockerfile
    image: ${CARLA_TOOLCHAIN_IMAGE:-my-ad/carla-toolchain:arm64}
    profiles: ["build"]
    entrypoint: []
    environment:
      <<: *carla-environment
      CARLA_UNREAL_ENGINE_PATH: /workspace/unreal-engine
    volumes:
      - ${CARLA_SOURCE_DIR:-./third_party/carla}:/workspace/carla:rw
      - ${CARLA_UE_DIR:-./third_party/unreal-engine}:/workspace/unreal-engine:rw
      - ${CARLA_ARTIFACT_DIR:-./artifacts/carla}:/artifacts/carla
      - ./scripts:/opt/my-ad/scripts:ro
    command: ["bash"]

  carla-ue-setup:
    <<: *carla-common
    build:
      context: .
      dockerfile: images/carla-arm64/Dockerfile
    image: ${CARLA_TOOLCHAIN_IMAGE:-my-ad/carla-toolchain:arm64}
    profiles: ["ue-setup"]
    entrypoint: ["bash", "/opt/my-ad/scripts/carla/ue-setup.sh"]
    environment:
      <<: *carla-environment
      CARLA_UNREAL_ENGINE_PATH: /workspace/unreal-engine
    volumes:
      - ${CARLA_SOURCE_DIR:-./third_party/carla}:/workspace/carla:ro
      - ${CARLA_UE_DIR:-./third_party/unreal-engine}:/workspace/unreal-engine:rw
      - ${CARLA_ARTIFACT_DIR:-./artifacts/carla}:/artifacts/carla
      - ./scripts:/opt/my-ad/scripts:ro
    working_dir: /workspace/unreal-engine
    command: ["check"]
